<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vault / 仓库对比</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand"><span class="logo">◇</span><div>VAULT<span class="subtitle">仓库对比工作台</span></div></div><span class="header-note">本地文档 · 远程状态</span></header>
<main><section class="intro"><div><span class="eyebrow">OBSIDIAN SYNC</span><h1>每一份笔记，都有迹可循。</h1><p>扫描你的仓库，查看文档，并核对两端的内容。</p></div><span class="intro-mark">↗</span></section>
<form id="scan-form" class="config"><label class="local-field">本地仓库路径<input id="local" placeholder="例如 /Users/你的用户名/Documents/Obsidian" required></label><label>对比来源<select id="mode"><option value="http">远程 HTTP 服务</option><option value="directory">另一个仓库目录</option></select></label><label class="remote-field"><span id="remote-label">远程服务地址</span><input id="remote" value="http://127.0.0.1:9988" required></label><button class="primary" id="scan" type="submit">↻ 扫描并对比</button></form>
<div id="message" role="status" aria-live="polite">路径对应运行此页面服务的电脑。递归扫描全部子目录，跳过本地隐藏文件、隐藏目录及符号链接。</div>
<section class="workspace"><aside><div class="panel-heading"><h2>仓库文件</h2><span id="count">0 个文件</span></div><div class="search"><input id="search" aria-label="搜索相对路径" placeholder="搜索文件名或相对路径…"></div><div class="filters" id="filters"><button class="active" data-filter="all">全部</button><button data-filter="modified">修改</button><button data-filter="local">本地新增</button><button data-filter="remote">远程新增</button></div><nav id="tree" aria-label="文档目录树"><div class="empty-tree">◇<p>仓库还未扫描</p><small>填写路径，开始整理你的文档。</small></div></nav><div class="legend"><span><i class="dot same"></i>一致</span><span><i class="dot modified"></i>修改</span><span><i class="dot local"></i>本地新增</span><span><i class="dot remote"></i>远程新增</span></div></aside>
<article><div class="document-heading"><div><h2 id="filename">文档预览</h2><div id="filepath">选择左侧文件以查看内容</div></div><span id="file-status" class="badge"></span></div><div class="document-toolbar"><div class="tabs"><button id="local-tab" class="active" disabled>本地内容</button><button id="remote-tab" disabled>远程内容</button><button id="diff-tab" hidden>Diff</button></div><div class="sync-actions"><button id="push" hidden title="用本地内容写入远程，已有文件会被覆盖">↑ Push</button><button id="pull" hidden title="用远程内容保存到本地，已有文件会被覆盖">↓ Pull</button><button id="del" hidden title="删除远程文件，保留本地文件">Del</button></div><span id="details">UTF-8 · 纯文本</span></div><div id="placeholder" class="placeholder"><div>▤</div><h3>打开一份笔记</h3><p>左侧保留仓库目录结构。<br>选择文档，在这里查看本地或远程内容。</p></div><pre id="content" hidden></pre><div id="diff-view" hidden aria-label="本地与远程逐行差异"></div></article></section><footer>Push 本地 → 远程 · Pull 远程 → 本地<span id="summary">等待首次扫描</span></footer></main><script src="/app.js"></script></body></html>
